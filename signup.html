<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
  <title>Create Account — MerchantPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       PALETTE — Obsidian · Jade · Champagne
       ============================================================ */
    :root,
    [data-theme="dark"] {
      --bg: #070b0d;
      --bg-1: #0b1114;
      --bg-2: #0f171b;
      --bg-3: #131e23;
      --hover: #18262c;
      --line: #1d2f36;
      --line-2: #294049;
      --text: #eef5f6;
      --text-2: #a9c1c7;
      --text-3: #6f8a92;
      --text-4: #4a626a;
      --jade: #34e0c4;
      --jade-2: #22c7ab;
      --jade-soft: rgba(52, 224, 196, 0.12);
      --jade-line: rgba(52, 224, 196, 0.28);
      --champagne: #f2d0a4;
      --champagne-soft: rgba(242, 208, 164, 0.12);
      --red: #ff6b6b;
      --red-soft: rgba(255, 107, 107, 0.12);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.55);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.65);
      --header-bg: rgba(7, 11, 13, 0.72);
      --glass: rgba(15, 23, 27, 0.6);
      --glass-line: rgba(255, 255, 255, 0.06);
      --glow: rgba(52, 224, 196, 0.25);
      --noise-opacity: 0.035;
    }

    [data-theme="light"] {
      --bg: #f4faf9;
      --bg-1: #ffffff;
      --bg-2: #ffffff;
      --bg-3: #fbfdfd;
      --hover: #e8f3f1;
      --line: #d6e6e3;
      --line-2: #b9d4cf;
      --text: #061014;
      --text-2: #2f4a51;
      --text-3: #5c7880;
      --text-4: #8ba6ac;
      --jade: #0f9d8b;
      --jade-2: #0b8575;
      --jade-soft: rgba(15, 157, 139, 0.1);
      --jade-line: rgba(15, 157, 139, 0.25);
      --champagne: #b6792e;
      --champagne-soft: rgba(182, 121, 46, 0.1);
      --red: #d64545;
      --red-soft: rgba(214, 69, 69, 0.1);
      --shadow-sm: 0 1px 2px rgba(6, 16, 20, 0.06);
      --shadow-md: 0 12px 32px rgba(6, 16, 20, 0.1);
      --shadow-lg: 0 30px 80px rgba(6, 16, 20, 0.14);
      --header-bg: rgba(244, 250, 249, 0.75);
      --glass: rgba(255, 255, 255, 0.65);
      --glass-line: rgba(6, 16, 20, 0.06);
      --glow: rgba(15, 157, 139, 0.15);
      --noise-opacity: 0.02;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: var(--font-sans);
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 22px;
      --r-xl: 32px;
      --ease: 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      transition: background-color 350ms ease, color 350ms ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      /* Immersive background glow */
      background-image: 
        radial-gradient(ellipse 70% 60% at 50% 0%, var(--glow), transparent 70%),
        radial-gradient(ellipse 40% 40% at 90% 90%, var(--champagne-soft), transparent 60%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      transition: opacity 350ms ease;
    }

    [dir="rtl"] body { text-align: right; }

    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }

    .skip-link {
      position: absolute; top: -100px; left: 8px; padding: 10px 18px;
      background: var(--jade); color: #03110e; border-radius: var(--r-sm);
      font-size: 14px; font-weight: 700; z-index: 9999; transition: top 200ms;
    }
    .skip-link:focus { top: 8px; }

    /* ============================================================
       TOP NAVIGATION
       ============================================================ */
    .auth-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 40px;
      position: relative;
      z-index: 10;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .brand-logo__mark {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      fill: var(--jade);
      transition: transform var(--ease);
    }

    .brand-logo:hover .brand-logo__mark { transform: rotate(-8deg); }

    .brand-logo__text-accent {
      background: linear-gradient(120deg, var(--jade), var(--champagne));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--jade);
    }

    .auth-nav__actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .auth-nav__back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-2);
      transition: color var(--ease);
    }

    .auth-nav__back:hover { color: var(--text); }

    .auth-nav__back svg {
      width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      border: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(10px);
      transition: all var(--ease);
      flex-shrink: 0;
    }

    .icon-btn:hover { color: var(--text); background: var(--hover); border-color: var(--line-2); }

    .icon-btn svg {
      width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    }

    .icon-btn .icon-sun { display: none; }
    [data-theme="light"] .icon-btn .icon-sun { display: block; }
    [data-theme="light"] .icon-btn .icon-moon { display: none; }

    /* ============================================================
       MAIN LAYOUT (Floating Glass Card)
       ============================================================ */
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 60px;
      position: relative;
      z-index: 5;
    }

    .auth-card {
      width: 100%;
      max-width: 520px; /* Slightly wider for signup form */
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-line);
      border-radius: var(--r-xl);
      padding: 44px 48px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .auth-card {
      box-shadow: 0 40px 100px rgba(6, 16, 20, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--jade-line), transparent);
    }

    /* Card Header (Title + Login Toggle) */
    .auth-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .auth-card__title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--text);
    }

    .auth-card__title em {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(120deg, var(--jade), var(--champagne));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-card__sub {
      font-size: 14.5px;
      color: var(--text-2);
      margin-top: 6px;
    }

    /* Login Button in Header */
    .auth-card__login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 100px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: all var(--ease);
      margin-top: 4px;
      flex-shrink: 0;
    }

    .auth-card__login-btn:hover {
      background: var(--jade-soft);
      border-color: var(--jade-line);
      color: var(--jade);
      transform: translateY(-1px);
    }

    /* Progress Indicator */
    .auth-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .auth-progress__step {
      flex: 1;
      height: 4px;
      border-radius: 100px;
      background: var(--line);
      transition: background var(--ease);
    }

    .auth-progress__step.is-active {
      background: var(--jade);
      box-shadow: 0 0 12px var(--jade-soft);
    }

    /* ============================================================
       FORM ELEMENTS
       ============================================================ */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    .form-group__label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    .form-input-wrap {
      position: relative;
    }

    .form-input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--text-3);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      transition: stroke var(--ease);
    }

    [dir="rtl"] .form-input-icon { left: auto; right: 14px; }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 44px;
      border-radius: var(--r-sm);
      background: var(--bg-1);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }

    [dir="rtl"] .form-input { padding: 0 44px 0 14px; }

    .form-input::placeholder { color: var(--text-4); }
    .form-input:hover { border-color: var(--line-2); }

    .form-input:focus {
      border-color: var(--jade);
      background: var(--bg-2);
      box-shadow: 0 0 0 3px var(--jade-soft);
    }

    .form-input-wrap:focus-within .form-input-icon { stroke: var(--jade); }

    .form-input-action {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      transition: all var(--ease);
    }

    [dir="rtl"] .form-input-action { right: auto; left: 8px; }
    .form-input-action:hover { color: var(--text); background: var(--hover); }

    .form-input-action svg {
      width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    /* Password strength meter */
    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      height: 4px;
    }

    .password-strength__bar {
      flex: 1;
      border-radius: 100px;
      background: var(--line);
      transition: background var(--ease);
    }

    .password-strength__bar.is-weak { background: var(--red); }
    .password-strength__bar.is-medium { background: var(--champagne); }
    .password-strength__bar.is-strong { background: var(--jade); }

    /* Checkbox */
    .form-checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 28px;
      margin-top: 8px;
    }

    .form-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--line-2);
      background: var(--bg-1);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all var(--ease);
    }

    .form-checkbox:checked { background: var(--jade); border-color: var(--jade); }

    .form-checkbox:checked::after {
      content: "";
      position: absolute;
      left: 5px; top: 2px;
      width: 5px; height: 9px;
      border: solid #03110e;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .form-checkbox:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

    .form-checkbox-label {
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
      line-height: 1.5;
    }

    .form-checkbox-label a {
      color: var(--jade);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .form-checkbox-label a:hover { opacity: 0.8; }

    /* Submit Button */
    .form-submit {
      width: 100%;
      height: 50px;
      border-radius: var(--r-sm);
      background: var(--jade);
      color: #03110e;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--ease);
      box-shadow: 0 12px 32px var(--jade-soft);
      margin-bottom: 24px;
    }

    .form-submit:hover {
      background: var(--jade-2);
      transform: translateY(-2px);
      box-shadow: 0 18px 48px var(--jade-soft);
    }

    .form-submit:active { transform: translateY(0); }

    .form-submit svg {
      width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
      transition: transform var(--ease);
    }

    .form-submit:hover svg { transform: translateX(3px); }

    /* Divider */
    .form-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      color: var(--text-4);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--font-mono);
    }

    .form-divider::before,
    .form-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* Social Login */
    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--bg-1);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      transition: all var(--ease);
      white-space: nowrap;
    }

    .social-btn:hover {
      background: var(--hover);
      border-color: var(--line-2);
      transform: translateY(-1px);
    }

    .social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Bottom Login Prompt */
    .auth-card__footer {
      text-align: center;
      font-size: 14px;
      color: var(--text-3);
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .auth-card__footer a {
      color: var(--text);
      font-weight: 600;
      transition: color var(--ease);
    }

    .auth-card__footer a:hover { color: var(--jade); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .auth-nav { padding: 20px 24px; }
      .auth-main { padding: 10px 16px 40px; }
      .auth-card { padding: 32px 24px; }
      .auth-card__header { flex-direction: column; align-items: stretch; gap: 16px; }
      .auth-card__login-btn { align-self: flex-start; margin-top: 0; }
      .auth-card__title { font-size: 28px; }
      .form-row { grid-template-columns: 1fr; gap: 20px; }
    }

    @media (max-width: 480px) {
      .auth-nav { padding: 16px; }
      .auth-nav__back span { display: none; }
      .auth-nav__back { padding: 8px; border: 1px solid var(--line); border-radius: var(--r-sm); }
      .auth-card { padding: 28px 20px; }
      .social-login { grid-template-columns: 1fr; }
      .form-input { height: 46px; }
      .form-submit { height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a href="#signup-form" class="skip-link">Skip to signup form</a>

  <!-- ============================================================
       TOP NAVIGATION
       ============================================================ -->
  <header class="auth-nav">
    <a href="index.html" class="brand-logo">
      <svg class="brand-logo__mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M12.927 16.371a1.47 1.47 0 0 0 .061 2.027l68.595 68.594c.555.555 1.446.59 2.026.062 10.058-9.152 16.372-22.348 16.372-37.018C99.98 22.402 77.579 0 49.945 0c-14.67 0-27.866 6.313-37.018 16.371M4.353 29.39a1.47 1.47 0 0 0 .309 1.648L68.943 95.32c.434.434 1.09.562 1.648.308a50 50 0 0 0 4.335-2.227c.834-.482.962-1.62.28-2.3L8.882 24.773c-.68-.68-1.818-.553-2.3.281a50 50 0 0 0-2.228 4.334m-3.9 18.407a1.48 1.48 0 0 1-.432-1.14q.2-2.986.74-5.866c.215-1.15 1.62-1.55 2.448-.722l56.703 56.704c.828.827.429 2.233-.722 2.448a50 50 0 0 1-5.865.74 1.48 1.48 0 0 1-1.14-.433zm3.48 13.963c-1.033-1.033-2.7-.143-2.322 1.268C6.221 80.22 19.761 93.76 36.954 98.37c1.41.379 2.3-1.289 1.268-2.322z"/>
      </svg>
      <span>Merchant<span class="brand-logo__text-accent">Pay</span></span>
    </a>

    <div class="auth-nav__actions">
      <a href="index.html" class="auth-nav__back">
        <svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        <span>Home</span>
      </a>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- ============================================================
       MAIN AUTH CARD
       ============================================================ -->
  <main class="auth-main">
    <div class="auth-card">
      
      <!-- Header with Login Toggle -->
      <div class="auth-card__header">
        <div>
          <h1 class="auth-card__title">Create an <em>account.</em></h1>
          <p class="auth-card__sub">Start accepting payments in minutes.</p>
        </div>
        <a href="login.html" class="auth-card__login-btn">Log in</a>
      </div>

      <!-- Progress Indicator -->
      <div class="auth-progress" aria-hidden="true">
        <div class="auth-progress__step is-active"></div>
        <div class="auth-progress__step"></div>
        <div class="auth-progress__step"></div>
      </div>

      <form id="signup-form" novalidate>

        <!-- Name Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="signup-first-name" class="form-group__label">First name</label>
            <div class="form-input-wrap">
              <input
                type="text"
                id="signup-first-name"
                class="form-input"
                placeholder="Daniel"
                autocomplete="given-name"
                required
              >

        <button type="submit" class="form-submit">

        <div class="social-login">

  </main>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      const root = document.documentElement;
      const THEME_KEY = 'merchantpay-theme';

      /* Theme */
      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      }

      (function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (saved === 'dark' || saved === 'light') {
          applyTheme(saved);
        } else {
          const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          applyTheme(prefersLight ? 'light' : 'dark');
        }
      })();

      document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const current = root.getAttribute('data-theme');
          applyTheme(current === 'dark' ? 'light' : 'dark');
        });
      });

      /* RTL toggle */
      const DIR_KEY = 'merchantpay-dir';
      (function initDir() {
        let saved = null;
        try { saved = localStorage.getItem(DIR_KEY); } catch (e) {}
        if (saved === 'rtl') {
          root.setAttribute('dir', 'rtl');
          root.setAttribute('lang', 'ar');
        }
      })();

      /* Password visibility toggle */
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('signup-password');
      const eyeIcon = document.getElementById('eye-icon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function () {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');

          if (isPassword) {
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
          } else {
            eyeIcon.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
          }
        });
      }

      /* Password strength meter */
      const strengthBars = document.querySelectorAll('#password-strength .password-strength__bar');
      
      if (passwordInput && strengthBars.length) {
        passwordInput.addEventListener('input', function () {
          const val = passwordInput.value;
          let score = 0;
          
          if (val.length >= 8) score++;
          if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
          if (/\d/.test(val)) score++;
          if (/[^A-Za-z0-9]/.test(val)) score++;

          strengthBars.forEach(function (bar, index) {
            bar.className = 'password-strength__bar';
            if (index < score) {
              if (score <= 2) bar.classList.add('is-weak');
              else if (score === 3) bar.classList.add('is-medium');
              else bar.classList.add('is-strong');
            }
          });
        });
      }

      /* Form submission */
      const signupForm = document.getElementById('signup-form');
      if (signupForm) {
        signupForm.addEventListener('submit', function (e) {
          e.preventDefault();
          
          const termsCheckbox = document.getElementById('terms-agree');
          if (termsCheckbox && !termsCheckbox.checked) {
            termsCheckbox.focus();
            termsCheckbox.style.outline = '2px solid var(--red)';
            setTimeout(function() { termsCheckbox.style.outline = ''; }, 1500);
            return;
          }

          const submitBtn = signupForm.querySelector('.form-submit');
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'Creating account…';
          
          // Simulate network request
          setTimeout(function () {
            submitBtn.innerHTML = '✓ Success! Redirecting…';
            submitBtn.style.background = 'var(--jade-2)';
            
            setTimeout(function () {
              window.location.href = 'user-dashboard.html';
            }, 800);
          }, 1200);
        });
      }

    })();
  </script>
</body>
