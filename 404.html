<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found — MerchantPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       PALETTE — Obsidian · Jade · Champagne
       ============================================================ */
    :root,
    [data-theme="dark"] {
      --bg: #070b0d;
      --bg-1: #0b1114;
      --bg-2: #0f171b;
      --bg-3: #131e23;
      --hover: #18262c;
      --line: #1d2f36;
      --line-2: #294049;
      --text: #eef5f6;
      --text-2: #a9c1c7;
      --text-3: #6f8a92;
      --text-4: #4a626a;
      --jade: #34e0c4;
      --jade-2: #22c7ab;
      --jade-soft: rgba(52, 224, 196, 0.12);
      --jade-line: rgba(52, 224, 196, 0.28);
      --champagne: #f2d0a4;
      --champagne-soft: rgba(242, 208, 164, 0.12);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.55);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.65);
      --glass: rgba(15, 23, 27, 0.6);
      --glass-line: rgba(255, 255, 255, 0.06);
      --glow: rgba(52, 224, 196, 0.25);
      --noise-opacity: 0.035;
    }

    [data-theme="light"] {
      --bg: #f4faf9;
      --bg-1: #ffffff;
      --bg-2: #ffffff;
      --bg-3: #fbfdfd;
      --hover: #e8f3f1;
      --line: #d6e6e3;
      --line-2: #b9d4cf;
      --text: #061014;
      --text-2: #2f4a51;
      --text-3: #5c7880;
      --text-4: #8ba6ac;
      --jade: #0f9d8b;
      --jade-2: #0b8575;
      --jade-soft: rgba(15, 157, 139, 0.1);
      --jade-line: rgba(15, 157, 139, 0.25);
      --champagne: #b6792e;
      --champagne-soft: rgba(182, 121, 46, 0.1);
      --shadow-sm: 0 1px 2px rgba(6, 16, 20, 0.06);
      --shadow-md: 0 12px 32px rgba(6, 16, 20, 0.1);
      --shadow-lg: 0 30px 80px rgba(6, 16, 20, 0.14);
      --glass: rgba(255, 255, 255, 0.65);
      --glass-line: rgba(6, 16, 20, 0.06);
      --glow: rgba(15, 157, 139, 0.15);
      --noise-opacity: 0.02;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: var(--font-sans);
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 22px;
      --r-xl: 32px;
      --ease: 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      transition: background-color 350ms ease, color 350ms ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      /* Immersive background glow */
      background-image: 
        radial-gradient(ellipse 60% 50% at 50% 50%, var(--glow), transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 80%, var(--champagne-soft), transparent 60%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      transition: opacity 350ms ease;
    }

    [dir="rtl"] body { text-align: right; }

    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    .skip-link {
      position: absolute; top: -100px; left: 8px; padding: 10px 18px;
      background: var(--jade); color: #03110e; border-radius: var(--r-sm);
      font-size: 14px; font-weight: 700; z-index: 9999; transition: top 200ms;
    }
    .skip-link:focus { top: 8px; }

    /* ============================================================
       FLOATING THEME TOGGLE
       ============================================================ */
    .theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      border: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(10px);
      transition: all var(--ease);
      z-index: 50;
    }

    [dir="rtl"] .theme-toggle { right: auto; left: 24px; }

    .theme-toggle:hover { color: var(--text); background: var(--hover); border-color: var(--line-2); }

    .theme-toggle svg {
      width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    }

    .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    /* ============================================================
       MAIN CENTERED LAYOUT
       ============================================================ */
    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      z-index: 5;
      text-align: center;
    }

    .error-content {
      max-width: 540px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 40px;
      opacity: 0.8;
      transition: opacity var(--ease);
    }

    .brand-logo:hover { opacity: 1; }

    .brand-logo__mark {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      fill: var(--jade);
    }

    .brand-logo__text-accent {
      background: linear-gradient(120deg, var(--jade), var(--champagne));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--jade);
    }

    /* Massive 404 Typography */
    .error-code {
      font-family: var(--font-sans);
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 0.85;
      margin-bottom: 12px;
      position: relative;
      display: inline-block;
      background: linear-gradient(180deg, var(--text) 20%, transparent 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--text);
      animation: float 6s ease-in-out infinite;
    }

    /* Subtle animation for the 404 text */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Decorative glow behind the 404 */
    .error-code-wrap {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .error-code-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, var(--jade-soft) 0%, transparent 60%);
      z-index: -1;
      filter: blur(40px);
    }

    /* Error Title */
    .error-title {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 16px;
    }

    .error-title em {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(120deg, var(--jade), var(--champagne));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Error Description */
    .error-desc {
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-2);
      max-width: 44ch;
      margin: 0 auto 40px;
    }

    /* Actions */
    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 24px;
      border-radius: 100px;
      font-size: 14.5px;
      font-weight: 600;
      transition: all var(--ease);
      white-space: nowrap;
    }

    .btn svg {
      width: 16px; height: 16px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transition: transform var(--ease);
    }

    .btn--solid {
      background: var(--jade);
      color: #03110e;
      box-shadow: 0 12px 32px var(--jade-soft);
    }

    .btn--solid:hover {
      background: var(--jade-2);
      transform: translateY(-2px);
      box-shadow: 0 18px 48px var(--jade-soft);
    }

    .btn--solid:hover svg { transform: translateX(-3px); }

    .btn--glass {
      background: var(--glass);
      backdrop-filter: blur(10px);
      color: var(--text);
      border: 1px solid var(--line-2);
    }

    .btn--glass:hover {
      background: var(--hover);
      border-color: var(--jade-line);
      transform: translateY(-2px);
    }

    /* Footer Help */
    .error-footer {
      margin-top: 56px;
      font-size: 13.5px;
      color: var(--text-3);
    }

    .error-footer a {
      color: var(--text-2);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color var(--ease);
    }

    .error-footer a:hover { color: var(--jade); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      .theme-toggle { top: 16px; right: 16px; width: 36px; height: 36px; }
      [dir="rtl"] .theme-toggle { right: auto; left: 16px; }
      .error-main { padding: 24px 16px; }
      .error-code { font-size: clamp(90px, 25vw, 120px); }
      .error-actions { flex-direction: column; }
      .btn { width: 100%; }
      .error-footer { margin-top: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Theme Toggle (Floating) -->
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <!-- ============================================================
       MAIN CONTENT (Centered)
       ============================================================ -->
  <main class="error-main" id="main-content">
    <div class="error-content">
      
      <!-- Logo -->
      <a href="index.html" class="brand-logo">
        <svg class="brand-logo__mark" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M12.927 16.371a1.47 1.47 0 0 0 .061 2.027l68.595 68.594c.555.555 1.446.59 2.026.062 10.058-9.152 16.372-22.348 16.372-37.018C99.98 22.402 77.579 0 49.945 0c-14.67 0-27.866 6.313-37.018 16.371M4.353 29.39a1.47 1.47 0 0 0 .309 1.648L68.943 95.32c.434.434 1.09.562 1.648.308a50 50 0 0 0 4.335-2.227c.834-.482.962-1.62.28-2.3L8.882 24.773c-.68-.68-1.818-.553-2.3.281a50 50 0 0 0-2.228 4.334m-3.9 18.407a1.48 1.48 0 0 1-.432-1.14q.2-2.986.74-5.866c.215-1.15 1.62-1.55 2.448-.722l56.703 56.704c.828.827.429 2.233-.722 2.448a50 50 0 0 1-5.865.74 1.48 1.48 0 0 1-1.14-.433zm3.48 13.963c-1.033-1.033-2.7-.143-2.322 1.268C6.221 80.22 19.761 93.76 36.954 98.37c1.41.379 2.3-1.289 1.268-2.322z"/>
        </svg>
        <span>Merchant<span class="brand-logo__text-accent">Pay</span></span>
      </a>

      <!-- 404 Text -->
      <div class="error-code-wrap">
        <div class="error-code">404</div>
      </div>

      <!-- Title -->
      <h1 class="error-title">Page <em>not found.</em></h1>

      <!-- Description -->
      <p class="error-desc">
        The page you're looking for doesn't exist, was moved, or is temporarily unavailable. 
        Let's get you back to familiar territory.
      </p>

      <!-- Actions -->
      <div class="error-actions">
        <a href="index.html" class="btn btn--solid">
          <svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          Back to home
        </a>
        <a href="contact.html" class="btn btn--glass">
          Contact support
        </a>
      </div>

      <!-- Footer Help -->
      <div class="error-footer">
        Need to manage payments? <a href="login.html">Log in to your dashboard</a>
      </div>

    </div>
  </main>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      const root = document.documentElement;
      const THEME_KEY = 'merchantpay-theme';

      /* Theme */
      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      }

      (function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (saved === 'dark' || saved === 'light') {
          applyTheme(saved);
        } else {
          const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          applyTheme(prefersLight ? 'light' : 'dark');
        }
      })();

      document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const current = root.getAttribute('data-theme');
          applyTheme(current === 'dark' ? 'light' : 'dark');
        });
      });

      /* RTL toggle (kept for consistency) */
      const DIR_KEY = 'merchantpay-dir';
      (function initDir() {
        let saved = null;
        try { saved = localStorage.getItem(DIR_KEY); } catch (e) {}
        if (saved === 'rtl') {
          root.setAttribute('dir', 'rtl');
          root.setAttribute('lang', 'ar');
        }
      })();

    })();
  </script>
</body>
</html>
